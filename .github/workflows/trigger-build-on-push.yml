name: Trigger Build on Custom Push

on:
  push:
    branches:
      - custom

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build in workspace repo
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WORKSPACE_TOKEN }}" \
            "https://api.github.com/repos/maestroagi/openclaw-workspace/actions/workflows/build-and-push.yml/dispatches" \
            -d '{"ref":"main","inputs":{"reason":"custom-branch-push","force_build":"true"}}'
          echo "✅ Build triggered in openclaw-workspace"
